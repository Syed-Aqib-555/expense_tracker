name: expense_tracker
description: "A Flutter Expense Tracker App."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

cupertino_icons: ^1.0.8
hive: ^2.2.3
hive_flutter: ^1.1.0
intl: ^0.20.2
fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
